services:
  - type: web
    name: snoozely
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: APP_URL
        sync: false
